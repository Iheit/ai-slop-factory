name: Build

on:
  push:
    branches: [main, phase-1-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
        run: ctest --test-dir build --output-on-failure

      - name: Package sandbox
        run: |
          mkdir -p artifact/ai-slop-engine
          cp build/ai_slop_sandbox artifact/ai-slop-engine/
          cp README.md artifact/ai-slop-engine/
          cp -r Assets artifact/ai-slop-engine/ 2>/dev/null || true
          cp -r assets artifact/ai-slop-engine/ 2>/dev/null || true
          printf '%s\n' 'AI Slop Engine Phase 1' 'Run: ./ai_slop_sandbox' > artifact/ai-slop-engine/README.txt
          tar -czf ai-slop-engine-linux-x64.tar.gz -C artifact ai-slop-engine

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-slop-engine-linux-x64
          path: ai-slop-engine-linux-x64.tar.gz
          if-no-files-found: error
